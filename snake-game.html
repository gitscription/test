<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 32px;
        }

        #gameBoard {
            display: grid;
            grid-template-columns: repeat(20, 20px);
            grid-template-rows: repeat(20, 20px);
            gap: 1px;
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .cell {
            width: 20px;
            height: 20px;
            background-color: #222;
            border: 1px solid #333;
        }

        .snake {
            background-color: #4CAF50;
            border: 1px solid #45a049;
        }

        .food {
            background-color: #FF6B6B;
            border: 1px solid #ff5252;
            border-radius: 50%;
        }

        .info {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            color: white;
            font-size: 18px;
        }

        .score-box, .high-score-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 5px;
            backdrop-filter: blur(4px);
        }

        .controls {
            margin-top: 20px;
            color: white;
        }

        .controls p {
            margin: 5px 0;
            font-size: 14px;
        }

        #gameOverMessage {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        #gameOverMessage h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        #gameOverMessage p {
            font-size: 18px;
            margin: 10px 0;
        }

        button {
            margin-top: 15px;
            padding: 10px 30px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Snake Game</h1>
        <div id="gameBoard"></div>
        <div class="info">
            <div class="score-box">Score: <span id="score">0</span></div>
            <div class="high-score-box">High Score: <span id="highScore">0</span></div>
        </div>
        <div class="controls">
            <p>Use Arrow Keys or WASD to move</p>
            <p>Press SPACE to pause/resume</p>
            <button onclick="resetGame()">New Game</button>
        </div>
    </div>

    <div id="gameOverMessage">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>High Score: <span id="gameOverHighScore">0</span></p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <script>
        const GRID_SIZE = 20;
        const CELL_SIZE = 20;
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = true;
        let gamePaused = false;
        let gameBoard = document.getElementById('gameBoard');

        document.getElementById('highScore').textContent = highScore;

        // Create grid
        function createGrid() {
            gameBoard.innerHTML = '';
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                gameBoard.appendChild(cell);
            }
        }

        // Get cell index from coordinates
        function getCellIndex(x, y) {
            return y * GRID_SIZE + x;
        }

        // Draw game
        function draw() {
            // Clear all cells
            document.querySelectorAll('.cell').forEach(cell => {
                cell.className = 'cell';
            });

            // Draw snake
            snake.forEach((segment, index) => {
                const cellIndex = getCellIndex(segment.x, segment.y);
                const cell = document.getElementById(`cell-${cellIndex}`);
                if (cell) {
                    cell.classList.add('snake');
                }
            });

            // Draw food
            const foodIndex = getCellIndex(food.x, food.y);
            const foodCell = document.getElementById(`cell-${foodIndex}`);
            if (foodCell) {
                foodCell.classList.add('food');
            }
        }

        // Generate random food
        function generateFood() {
            let newFood;
            let isOnSnake = true;

            while (isOnSnake) {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };

                isOnSnake = snake.some(segment =>
                    segment.x === newFood.x && segment.y === newFood.y
                );
            }

            food = newFood;
        }

        // Update game
        function update() {
            if (!gameRunning || gamePaused) return;

            direction = nextDirection;

            // Calculate new head
            const head = snake[0];
            const newHead = {
                x: (head.x + direction.x + GRID_SIZE) % GRID_SIZE,
                y: (head.y + direction.y + GRID_SIZE) % GRID_SIZE
            };

            // Check collision with self
            if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
                endGame();
                return;
            }

            snake.unshift(newHead);

            // Check if food eaten
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                generateFood();
            } else {
                snake.pop();
            }

            draw();
        }

        // End game
        function endGame() {
            gameRunning = false;
            const gameOverDiv = document.getElementById('gameOverMessage');
            document.getElementById('finalScore').textContent = score;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
            }

            document.getElementById('gameOverHighScore').textContent = highScore;
            gameOverDiv.style.display = 'block';
        }

        // Reset game
        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameRunning = true;
            gamePaused = false;
            document.getElementById('score').textContent = '0';
            document.getElementById('gameOverMessage').style.display = 'none';
            document.getElementById('highScore').textContent = highScore;
            generateFood();
            draw();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            switch (e.key.toUpperCase()) {
                case 'ARROWUP':
                case 'W':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'ARROWDOWN':
                case 'S':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'ARROWLEFT':
                case 'A':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'ARROWRIGHT':
                case 'D':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
                case ' ':
                    gamePaused = !gamePaused;
                    e.preventDefault();
                    break;
            }
        });

        // Game loop
        const gameSpeed = 100; // milliseconds
        setInterval(update, gameSpeed);

        // Initialize game
        createGrid();
        generateFood();
        draw();
    </script>
</body>
</html>
